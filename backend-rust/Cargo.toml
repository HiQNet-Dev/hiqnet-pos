[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
pos-core = { path = "crates/pos-core" }
pos-application = { path = "crates/pos-application" }
pos-storage-sqlite = { path = "crates/pos-storage-sqlite" }
pos-licensing = { path = "crates/pos-licensing" }
pos-security = { path = "crates/pos-security" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3.47", features = ["serde", "formatting", "parsing", "macros"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
