name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain fijado por rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "::error::rust-toolchain.toml no declara channel"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup override set "$channel"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - name: Formato
        run: cargo fmt --manifest-path backend-rust/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path backend-rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test --locked --manifest-path backend-rust/Cargo.toml --workspace
      - name: Pruebas de staging de release
        run: python3 tools/test_stage_release.py

  frontend:
    name: Frontend (lint, tipos, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  desktop-windows:
    name: Tauri Windows (build de verificación)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain fijado por rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "::error::rust-toolchain.toml no declara channel"; exit 1; }
          rustup toolchain install "$channel" --profile minimal
          rustup override set "$channel"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pos-desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dependencias del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Compilar aplicación de escritorio
        working-directory: apps/pos-desktop/src-tauri
        run: pnpm dlx @tauri-apps/cli@2.12.4 build --debug --no-bundle

  desktop-linux:
    name: Tauri Linux (compilación real)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Seleccionar mirror apt alcanzable
        shell: bash
        run: |
          set -euo pipefail
          reachable() { curl -fsSL --max-time 20 -o /dev/null "$1/dists/noble/InRelease"; }
          if reachable http://azure.archive.ubuntu.com/ubuntu; then
            echo "Mirror configurado alcanzable"
            exit 0
          fi
          for mirror in http://archive.ubuntu.com/ubuntu https://archive.ubuntu.com/ubuntu; do
            if reachable "$mirror"; then
              echo "Usando mirror alcanzable: $mirror"
              if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                sudo sed -i -E "s#^URIs:.*#URIs: $mirror#" /etc/apt/sources.list.d/ubuntu.sources
              fi
              if [ -f /etc/apt/sources.list ]; then
                sudo sed -i -E "s#https?://[a-zA-Z0-9.-]+/ubuntu#$mirror#g" /etc/apt/sources.list
              fi
              sudo rm -rf /var/lib/apt/lists/*
              exit 0
            fi
          done
          echo "::warning::ningún mirror alternativo alcanzable; se intenta con el configurado"
      - name: Dependencias de Tauri 2
        run: |
          set -euo pipefail
          for intento in 1 2 3 4; do
            echo "Intento $intento de instalar dependencias del sistema"
            if timeout 300 sudo apt-get update -o Acquire::Retries=5 \
              && timeout 600 sudo apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                librsvg2-dev \
                libayatana-appindicator3-dev \
                libxdo-dev \
                libssl-dev \
                build-essential \
                file \
                patchelf; then
              exit 0
            fi
            sleep $((intento * 20))
          done
          echo "::error::no fue posible instalar las dependencias del sistema tras 4 intentos"
          exit 1
      - name: Toolchain fijado por rust-toolchain.toml
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "::error::rust-toolchain.toml no declara channel"; exit 1; }
          rustup toolchain install "$channel" --profile minimal
          rustup override set "$channel"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pos-desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dependencias del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Compilar aplicación de escritorio
        working-directory: apps/pos-desktop/src-tauri
        run: pnpm dlx @tauri-apps/cli@2.12.4 build --debug --no-bundle
      - name: Smoke nativo de la CLI offline
        working-directory: apps/pos-desktop/src-tauri
        run: ./target/debug/pos-desktop --help-backup

  supply-chain:
    name: Archivos prohibidos y auditoría
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos prohibidos y secretos
        run: bash tools/check-no-secrets.sh
      - name: Política de tamaño de archivos
        run: python3 tools/check_size_policy.py
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend-rust
          # Las excepciones viven en .cargo/audit.toml (raíz) y en
          # backend-rust/.cargo/audit.toml, con la justificación escrita en
          # docs/01-architecture/structural-audit-0.1.1.md §5.
          # Este input mantiene la excepción histórica de RUSTSEC-2023-0071
          # porque el action sólo admite un identificador.
          ignore: RUSTSEC-2023-0071
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Auditoría informativa de npm
        working-directory: frontend
        # Informativa y visible: no bloquea el job, pero el resultado queda en el log.
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
