[workspace]
resolver = "3"

[package]
name = "pos-desktop"
description = "Aplicación de escritorio HiQNet POS (Tauri 2)."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pos-core = { path = "../../../backend-rust/crates/pos-core" }
pos-application = { path = "../../../backend-rust/crates/pos-application" }
pos-storage-sqlite = { path = "../../../backend-rust/crates/pos-storage-sqlite" }
pos-security = { path = "../../../backend-rust/crates/pos-security" }
pos-licensing = { path = "../../../backend-rust/crates/pos-licensing" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
